<!doctype html>
<html lang="ro">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Admin</title>
  </head>

  <body>
    <div id="nc-root"></div>

    <!-- Netlify Identity Widget (MUST be before Decap) -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

    <script>
      // 1) Daca ai venit din email cu token (invite/confirm/recovery),
      //    asigura-te ca ramai pe /admin/#... (unde widgetul poate procesa tokenul).
      (function () {
        // daca esti pe /admin/ dar fara hash, dar ai query token (rar), il convertim in hash
        if (location.search && !location.hash) {
          location.replace("/admin/#" + location.search.replace(/^\?/, ""));
        }
      })();

      // 2) Dupa login, du-te direct in Decap (/admin/#/)
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("login", function () {
          // inchide modalul si intra in admin
          window.netlifyIdentity.close();
          if (location.pathname !== "/admin/" || location.hash !== "#/") {
            location.href = "/admin/#/";
          }
        });
      }
    </script>

    <!-- Decap CMS -->
    <script src="https://unpkg.com/decap-cms@3/dist/decap-cms.js"></script>
  </body>
</html>
