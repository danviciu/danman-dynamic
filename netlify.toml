# IMPORTANT: /admin este o mini-SPA. Fara asta, /admin/ sau /admin/#/ poate pica in 404 in anumite cazuri.
[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200
