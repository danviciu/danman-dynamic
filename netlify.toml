[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# IMPORTANT: /admin este o mini-SPA. Fara asta, /admin/ sau /admin/#/ poate pica in 404 in anumite cazuri.
[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

# Nota: /.netlify/identity/* este rezervat de Netlify (rejectat de parser daca il
# redefinim aici). Token-urile de confirmare/invitatie sunt deja redirectionate spre
# /admin/ prin scriptul inline din BaseLayout.astro, pe baza hash-ului din URL.
